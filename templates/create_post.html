{% extends "dashboard.html" %}

{% block body %}
<div>Create post</div>

<div class="main-container">
    <form action="/dashboard/posts/create_post", method="post">
        <br>
        <div class="title">
            <label for="title">Title : </label>
            <input type="text" id="title" name="title" required>
        </div>
        <br>
        <div class="post-content">
            <label for="content">Content : </label>
            <br>
            <textarea type="text" name="content" id="content" rows="10" required ></textarea>
        </div>
        <br>
        <div class="author">
            <label for="author">Author : </label>
            <input type="text" name="author" id="author" maxlength="100">
        </div>
        <br>
        <div class="slug">
            <label for="slug">Slug : </label>
            <input type="text" name="slug" id="slug" maxlength="30">
        </div>
        <br>
        <div class="submit_buttons">
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
        </div>
    </form>
</div>
{% endblock %}
