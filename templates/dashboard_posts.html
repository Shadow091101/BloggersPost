{% extends "dashboard.html" %} {% block body %}

<div class="main-container">
  <div class="create-posts-bar">
    <div>dashboard posts</div>
    <a href="{{url_for('create_post')}}">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        fill="currentColor"
        class="bi bi-plus-circle"
        viewBox="0 0 16 16"
      >
        <path
          d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
        />
        <path
          d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"
        /></svg
    ></a>
  </div>
  <div class="container my-5">
    <div class="row">
      <div class="col-lg-8 col-md-10 mx-auto">
        {% for post in posts %}

        <div class="post-preview">
          <a href="{{ url_for('posts', post_slug=post.slug) }}">
            <h2 class="post-title">{{ post.title }}</h2>
            <br />
            <h3 class="post-subtitle">{{ post.content[:120] }}...</h3>
          </a>
          <p class="post-meta">
            Posted by <strong>{{ post.author }}</strong> on {{ post.date }}
          </p>
        </div>

        <hr />

        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
